<article class="book-card">
    <a class="book-card__cover" href="{{ book.get_absolute_url }}">
        {% if book.image %}
            <img class="book-card__image" src="{{ book.image.url }}" alt="{{ book.title }}" loading="lazy">
        {% else %}
            <span class="book-card__empty">{{ book.title }}</span>
        {% endif %}
    </a>
    <div class="book-card__body">
        <p class="book-card__author">{{ book.author }}</p>
        <a class="book-card__title" href="{{ book.get_absolute_url }}">{{ book.title }}</a>
        <p class="book-card__meta">{{ book.genre }} · {{ book.year }}</p>
        <div class="book-card__bottom">
            {% include 'includes/availability.html' %}
        </div>
    </div>
</article>
