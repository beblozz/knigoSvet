{% load static %}
<header class="header">
    <div class="container header__inner">
        <div class="header__social">
            <span class="header__social-text">Электронный каталог<br>библиотеки</span>
        </div>

        <nav class="header__nav header__nav_left">
            <a class="header__link" href="{% url 'catalog' %}">Каталог</a>
            <a class="header__link" href="{% url 'home' %}#genres">Жанры</a>
        </nav>

        <a class="header__logo" href="{% url 'home' %}">
            <img class="header__logo-image" src="{% static 'img/logo.png' %}" alt="КнигоСвет" width="120" height="110">
        </a>

        <nav class="header__nav header__nav_right">
            <a class="header__link" href="{% url 'home' %}#new">Новые поступления</a>
            <a class="header__link" href="{% url 'home' %}#rules">Как взять книгу</a>
        </nav>

        <div class="header__side">
            <div class="header__contacts">
                <a class="header__phone" href="tel:+74951234567">+7 (495) 123 45 67</a>
                <span class="header__call">Пн–Сб, 10:00–20:00</span>
            </div>
            <div class="header__actions">
                <a class="header__action" href="{% url 'catalog' %}" title="Поиск книг">{% include 'icons/search.svg' %}</a>
                <a class="header__action" href="{% url 'panel' %}" title="Раздел библиотекаря">{% include 'icons/user.svg' %}</a>
                <button class="header__burger" id="burger" type="button" aria-label="Меню">{% include 'icons/menu.svg' %}</button>
            </div>
        </div>
    </div>

    <nav class="header__mobile" id="mobile-menu">
        <a class="header__mobile-link" href="{% url 'catalog' %}">Каталог</a>
        <a class="header__mobile-link" href="{% url 'home' %}#genres">Жанры</a>
        <a class="header__mobile-link" href="{% url 'home' %}#new">Новые поступления</a>
        <a class="header__mobile-link" href="{% url 'home' %}#rules">Как взять книгу</a>
        <a class="header__mobile-link" href="{% url 'panel' %}">Раздел библиотекаря</a>
    </nav>
</header>
